seed: ~

model:
  target: src.models.difflar_fused.LitDiffLaRFused
  model_kwargs:
    model_id: Llama-3.2-1B-Instruct
    sft_method: difflar_fused
    chat_template: False

    do_lora: True
    lora_config:
      r: 128
      lora_alpha: 32

    difflar_config:
      # Diffusion模型配置
      max_latent_length: 256
      num_timesteps: 1000
      num_inference_steps: 128
      train_inference_steps: 10
      noise_schedule: linear
      
      # 去噪网络配置
      denoiser_layers: 6
      denoiser_heads: 8
      dropout: 0.1
      
      # 损失权重
      diffusion_loss_weight: 1.0
      answer_loss_weight: 5.0
      
      # CFG配置
      use_cfg: False
      cfg_scale: 1.5
      
      # 数据归一化
      normalize_latent: True
      
      # 预测目标: epsilon(噪声), x0(干净数据), flow(Flow Matching速度)
      # 推荐使用 flow 以获得更稳定的训练
      prediction_type: flow
      clamp_value: 3.0
      
      # 采样器类型: ddpm, ddim, euler(仅用于flow)
      # 当prediction_type=flow时，采样器自动使用欧拉积分
      sampler_type: euler
      ddim_eta: 0.0
      
      # ═══ 两阶段训练配置 ═══
      stage1_epochs: 5              # Stage 1持续的epoch数
      
      # ═══ Rollout训练配置 ═══
      rollout_start_ratio: 0.3      # Stage 2初始Rollout比例
      rollout_final_ratio: 1.0      # Stage 2最终Rollout比例
      rollout_inference_steps: 10   # Rollout时的推理步数
      
      # ═══ Self-Conditioning配置 ═══
      stage1_self_cond_prob: 0.5    # Stage 1 Self-Cond概率
      stage2_self_cond_prob: 1.0    # Stage 2 Self-Cond概率（强制开启）

    answer_generation_config:
      max_new_tokens: 16
      do_sample: True
      top_p: 0.9
      temperature: 1.0

  training_kwargs:
    optimizer:
      target: torch.optim.AdamW
      lr: 1e-4
      weight_decay: 0.01
    use_scheduler: False
    scheduler:
      target: constant_schedule_with_warmup
      warmup_steps: 1000

trainer:
  max_epochs: 20

dataloader:
  batch_size: 64
  val_batch_size: 32
  num_workers: 8
  pin_memory: True
  persistent_workers: True
